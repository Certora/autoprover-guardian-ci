name: "Zeus Guardian CI"
description: "Run AI Auditor, AutoProver, or AutoFoundry on pull requests"
author: "Certora"

branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "Zeus API key"
    required: true

  engine:
    description: 'Engine to run: "ai-auditor", "auto-prover", or "auto-foundry"'
    required: false
    default: "ai-auditor"

  context:
    description: "AI Auditor only: comma-separated glob patterns for files to analyze"
    required: false

  github-token:
    description: "GitHub token for issues, PR comments, paid launch/validation, and generated-commit verification. Private AI previews and generated writes require the organization GitHub App."
    required: true
    default: "${{ github.token }}"

  api-base-url:
    description: "Zeus API base URL"
    required: false
    default: "https://zeus.certora.com"

  audit-type:
    description: 'AI Auditor only: "diff", "full", or a per-branch mapping such as "main:full,dev:diff"'
    required: false
    default: "diff"

  scope:
    description: "AI Auditor only: comma-separated scope patterns for full audits (subset of context to focus on)."
    required: false

  preprompt:
    description: "AI Auditor only: custom audit instructions"
    required: false

  use-memory:
    description: "Use AI Auditor repo memory for full audits. Set to false to skip previously accepted assumptions."
    required: false
    default: "true"

  max-iterations:
    description: "AI Auditor only: DeepDive iterations (4-10)"
    required: false
    default: "6"

  skip-submodules:
    description: "AI Auditor only: skip git submodule loading"
    required: false
    default: "false"

  poll-interval:
    description: "Seconds between status polls"
    required: false
    default: "60"

  timeout:
    description: "Maximum minutes to wait for audit completion"
    required: false
    default: "120"

  create-issues:
    description: "AI Auditor only: create GitHub issues for findings"
    required: false
    default: "true"

  issue-severities:
    description: 'AI Auditor only: comma-separated severities to create issues for (e.g., "HIGH,MEDIUM")'
    required: false
    default: "HIGH,MEDIUM"

  comment-on-pr:
    description: "Post a summary comment on the PR"
    required: false
    default: "true"

  fail-on:
    description: "AI Auditor only: fail if selected severities exist. Standalone engines use the fixed issues_found outcome policy."
    required: false
    default: ""

  labels:
    description: "AI Auditor only: comma-separated labels to add to created issues"
    required: false
    default: "ai-auditor,security"

  contract-path:
    description: "AutoProver/AutoFoundry only: repository-relative path to one Solidity contract"
    required: false

  contract-name:
    description: "AutoProver/AutoFoundry only: contract declaration name"
    required: false

  design-doc-path:
    description: "AutoProver/AutoFoundry only: optional repository-relative .md, .markdown, or .pdf design document"
    required: false

  threat-model-path:
    description: "AutoProver only: optional repository-relative .md, .markdown, or .pdf threat model"
    required: false

outputs:
  job-id:
    description: "Zeus audit job ID"

  status:
    description: "Last known audit status (succeeded, failed, cancelled, or cancellation_pending)"

  highs-count:
    description: "AI Auditor HIGH severity finding count"

  mediums-count:
    description: "AI Auditor MEDIUM severity finding count"

  lows-count:
    description: "AI Auditor LOW severity finding count"

  infos-count:
    description: "AI Auditor INFO severity finding count"

  issues-created:
    description: "AI Auditor comma-separated list of created issue references (for example, #123)"

  engine:
    description: "Engine selected for this run"

  run-outcome:
    description: "AutoProver verification or AutoFoundry test outcome (verified, verified_with_gaps, partial, issues_found, or unknown)"

  generated-files:
    description: "Comma-separated repository paths committed by AutoProver/AutoFoundry"

  generated-commit-sha:
    description: "Commit containing generated files; empty when no commit was needed"

runs:
  using: "node20"
  main: "dist/index.js"
