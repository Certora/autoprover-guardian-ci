name: "Certora Guardian CI"
description: "Run AI Auditor reviews and finding validations, AutoProver, or AutoFoundry on pull requests"
author: "Certora"

branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "Certora organization API key"
    required: true

  workflow:
    description: 'Workflow to run: "ai-auditor-full", "ai-auditor-diff", "ai-auditor-finding-validation", "auto-prover", or "auto-foundry"'
    required: false
    default: "ai-auditor-diff"

  context:
    description: "AI Auditor only: comma-separated glob patterns for files to analyze"
    required: false

  finding:
    description: "Finding validation only: finding description to validate (maximum 8000 characters)"
    required: false

  github-token:
    description: "GitHub token used locally by the action for issues, PR comments, and generated-commit verification. It is never sent to Certora. Private repository reads and generated writes require the organization GitHub App."
    required: true
    default: "${{ github.token }}"

  api-base-url:
    description: "Certora API base URL"
    required: false
    default: "https://app.certora.com"

  scope:
    description: "AI Auditor only: comma-separated scope patterns for full audits (subset of context to focus on)."
    required: false

  instructions:
    description: "AI Auditor only: custom audit instructions"
    required: false

  use-memory:
    description: "Use AI Auditor repo memory for full audits. Set to false to skip previously accepted assumptions."
    required: false
    default: "true"

  max-iterations:
    description: "AI Auditor only: DeepDive iterations (4-10)"
    required: false
    default: "6"

  skip-submodules:
    description: "AI Auditor only: skip git submodule loading"
    required: false
    default: "false"

  poll-interval:
    description: "Seconds between status polls"
    required: false
    default: "60"

  timeout:
    description: "Maximum minutes to wait for run completion"
    required: false
    default: "120"

  create-issues:
    description: "AI Auditor only: create GitHub issues for findings"
    required: false
    default: "true"

  issue-severities:
    description: 'AI Auditor only: comma-separated severities to create issues for (e.g., "HIGH,MEDIUM")'
    required: false
    default: "HIGH,MEDIUM"

  comment-on-pr:
    description: "Post a summary comment on the PR"
    required: false
    default: "true"

  fail-on:
    description: "AI Auditor only: fail if selected severities exist. Standalone workflows use the fixed issues_found outcome policy."
    required: false
    default: ""

  labels:
    description: "AI Auditor only: comma-separated labels to add to created issues"
    required: false
    default: "ai-auditor,security"

  contract-path:
    description: "AutoProver/AutoFoundry only: repository-relative path to one Solidity contract"
    required: false

  contract-name:
    description: "AutoProver/AutoFoundry only: contract declaration name"
    required: false

  design-doc-path:
    description: "AutoProver/AutoFoundry only: optional repository-relative .md, .markdown, or .pdf design document"
    required: false

  threat-model-path:
    description: "AutoProver only: optional repository-relative .md, .markdown, or .pdf threat model"
    required: false

outputs:
  run-id:
    description: "Certora run ID"

  status:
    description: "Last known run status (queued, running, finalizing, succeeded, failed, cancelling, or cancelled)"

  highs-count:
    description: "AI Auditor HIGH severity finding count"

  mediums-count:
    description: "AI Auditor MEDIUM severity finding count"

  lows-count:
    description: "AI Auditor LOW severity finding count"

  infos-count:
    description: "AI Auditor INFO severity finding count"

  issues-created:
    description: "AI Auditor comma-separated list of created issue references (for example, #123)"

  workflow:
    description: "Workflow selected for this run"

  run-outcome:
    description: "AutoProver verification or AutoFoundry test outcome (verified, verified_with_gaps, partial, issues_found, or unknown)"

  generated-files:
    description: "Comma-separated repository paths committed by AutoProver/AutoFoundry"

  generated-commit-sha:
    description: "Commit containing generated files; empty when no commit was needed"

  validation-verdict:
    description: "Finding validation verdict (VALID or INVALID); empty for other workflows or an unrecognized report"

  validation-severity:
    description: "Finding validation severity; empty when absent or not applicable"

runs:
  using: "node24"
  main: "dist/index.js"
