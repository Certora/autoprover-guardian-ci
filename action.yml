name: "AutoProver Guardian CI"
description: "Run AI Auditor reviews and finding validations, AutoProver, or AutoFuzzer on pull requests"
author: "Certora"

branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "Certora organization API key"
    required: true

  workflow:
    description: 'Workflow to run: "ai-auditor-full", "ai-auditor-diff", "ai-auditor-finding-validation", "auto-prover", or "auto-fuzzer"'
    required: false
    default: "ai-auditor-diff"

  model-mode:
    description: 'AI Auditor only (full, diff, and finding validation): model set "normal" or "frontier". Empty uses the server default, Normal; does not change max-iterations.'
    required: false
    default: ""

  context:
    description: "AI Auditor only: optional context override as a JSON string array or legacy comma-separated patterns (maximum 500 characters per pattern). Use JSON for paths containing commas. Empty selects context on the server during launch; no preview required."
    required: false
    default: ""

  finding:
    description: "Finding validation only: finding description to validate (maximum 8000 characters)"
    required: false

  github-token:
    description: "GitHub token used locally by the action for issues, PR comments, and generated-commit verification. It is never sent to Certora. Private repository reads and generated writes require the organization GitHub App."
    required: true
    default: "${{ github.token }}"

  api-base-url:
    description: "Certora API base URL"
    required: false
    default: "https://app.certora.com"

  scope:
    description: "Full AI Auditor only: audit scope as a JSON string array or legacy comma-separated patterns; required when context is empty. Use JSON for paths containing commas. With explicit context, scope is an optional subset to focus on. Diff audits use the immutable diff as scope."
    required: false

  instructions:
    description: "AI Auditor only: custom audit instructions (maximum 10000 characters)"
    required: false

  use-memory:
    description: "Use AI Auditor repo memory for full audits. Set to false to skip previously accepted assumptions."
    required: false
    default: "true"

  max-iterations:
    description: "Full/diff AI Auditor only: DeepDive iterations (2-10), independent of model-mode"
    required: false
    default: "6"

  skip-submodules:
    description: "AI Auditor only: skip git submodule loading"
    required: false
    default: "false"

  poll-interval:
    description: "Seconds between status polls"
    required: false
    default: "60"

  wait-for-completion:
    description: "Full/diff AI Auditor: wait on this runner for completion. Empty defaults to false and hands off to the server-owned Zeus AI Audit check. Other workflows remain synchronous."
    required: false
    default: ""

  timeout:
    description: "Maximum runner minutes for launch/handoff, or completion when wait-for-completion is true (does not set the server audit deadline)"
    required: false
    default: "120"

  create-issues:
    description: "AI Auditor only: create GitHub issues for findings"
    required: false
    default: "true"

  issue-severities:
    description: 'AI Auditor only: comma-separated severities to create issues for (e.g., "HIGH,MEDIUM")'
    required: false
    default: "HIGH,MEDIUM"

  comment-on-pr:
    description: "Post a summary comment on the PR"
    required: false
    default: "true"

  fail-on:
    description: "AI Auditor only: fail if selected severities exist. Standalone workflows use the fixed issues_found outcome policy."
    required: false
    default: ""

  labels:
    description: "AI Auditor only: comma-separated labels to add to created issues"
    required: false
    default: "ai-auditor,security"

  contract-path:
    description: "AutoProver/AutoFuzzer only: repository-relative path to one Solidity contract"
    required: false

  contract-name:
    description: "AutoProver/AutoFuzzer only: contract declaration name"
    required: false

  design-doc-path:
    description: "AutoProver/AutoFuzzer only: optional repository-relative .md, .markdown, or .pdf design document"
    required: false

  threat-model-path:
    description: "AutoProver only: optional repository-relative .md, .markdown, or .pdf threat model"
    required: false

outputs:
  run-id:
    description: "Certora run ID"

  status:
    description: "Last known run status (queued, running, finalizing, succeeded, failed, cancelling, or cancelled)"

  check-run-id:
    description: "Server-owned Zeus AI Audit GitHub check ID after asynchronous handoff"

  check-run-url:
    description: "Server-owned Zeus AI Audit GitHub check URL after asynchronous handoff"

  highs-count:
    description: "AI Auditor HIGH severity finding count; empty after asynchronous handoff"

  mediums-count:
    description: "AI Auditor MEDIUM severity finding count; empty after asynchronous handoff"

  lows-count:
    description: "AI Auditor LOW severity finding count; empty after asynchronous handoff"

  infos-count:
    description: "AI Auditor INFO severity finding count; empty after asynchronous handoff"

  issues-created:
    description: "AI Auditor comma-separated list of created issue references (for example, #123)"

  workflow:
    description: "Workflow selected for this run"

  model-mode:
    description: "AI Auditor model mode (normal or frontier); empty for other engines or a historical run without a recorded or explicitly requested mode"

  run-outcome:
    description: "AutoProver verification or AutoFuzzer test outcome (verified, verified_with_gaps, partial, issues_found, or unknown)"

  generated-files:
    description: "Comma-separated repository paths committed by AutoProver/AutoFuzzer"

  generated-commit-sha:
    description: "Commit containing generated files; empty when no commit was needed"

  validation-verdict:
    description: "Finding validation verdict (VALID or INVALID); empty for other workflows or an unrecognized report"

  validation-severity:
    description: "Finding validation severity; empty when absent or not applicable"

runs:
  using: "node24"
  main: "dist/index.js"
